name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run typecheck:ci
      - name: Cloudflare deploy dry run (checks wrangler.jsonc and the built assets)
        run: npx -y wrangler@4 deploy --dry-run
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check supabase/schema.sql on a throwaway Postgres
        run: |
          ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -yq postgresql)
          cp -r supabase /tmp/supabase && sudo chown -R postgres /tmp/supabase
          sudo -u postgres bash -c "cd /tmp && PG_BIN=\$(ls -d /usr/lib/postgresql/*/bin | tail -1) bash /tmp/supabase/test-schema.sh"
